name: Claude Code Review

# Runs once per PR (not on every push). For a re-review after changes,
# comment `@claude review` on the PR (handled by claude.yml).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/reference/**"

jobs:
  claude-review:
    # Skip fork PRs: pull_request-triggered runs from forks get no secrets and
    # no OIDC token issuance regardless of declared permissions, so this job
    # cannot succeed for them (see run 35444718198 / PR #295).
    if: |
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against `.claude/review-criteria.md`. Read that
            file first, then `gh pr diff`. Only open other files when a
            rubric item requires it (e.g. grep the relevant
            `docs/reference/` doc for a changed field or endpoint — do not
            read reference docs end to end).

            Lint, formatting, types, print/f-string logging, and the
            confidentiality identifier scan are enforced by CI — do not
            re-check them.

            Report only issues, one line each:
              §<N> <file>:<line> — <description>
            If nothing to flag, say "LGTM". No praise, no summary of the PR.

            Post the result as a single comment with `gh pr comment`.

          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 15
            --allowed-tools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
